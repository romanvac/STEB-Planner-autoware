steb_planner_node:
  ros__parameters:
    STEB:
      # ── Vehicle ────────────────────────────────────────────────────────
      VehicleParam:
        width:               1.9
        length:              4.9
        height:              2.5
        front_suspension:    1.0
        rear_suspension:     1.10
        max_steering_angle:  0.70
        min_turning_radius:  5.0
        wheelbase:           2.79
        rear_axle_2_center:  1.5
        max_vel_x:           10.0
        max_vel_x_backwards: 0.2
        max_vel_theta:       0.5
        max_longitudinal_acc: 2.0
        max_lateral_acc:     2.0
        max_theta_acc:       0.5
        circle_radius:       1.0

      # ── CollisionFreeCorridor ──────────────────────────────────────────
      CollisionFreeCorridor:
        is_avoiding_unknown:    false
        is_avoiding_car:        true
        is_avoiding_truck:      true
        is_avoiding_bus:        true
        is_avoiding_bicycle:    true
        is_avoiding_motorbike:  true
        is_avoiding_pedestrian: true
        is_avoiding_animal:     false

        soft_clearance_from_road:            0.3
        extra_desired_clearance_from_road:   0.0
        soft_clearance_from_object:          1.0
        extra_desired_clearance_from_object: 0.0
        max_bound_search_width:              5.0

      # ── Trajectory ─────────────────────────────────────────────────────
      Trajectory:
        steb_autosize:                     true
        auto_resize_resolution:            1.4
        auto_resize_resolution_hysteresis: 0.6
        min_samples:                       5
        max_samples:                       100
        max_global_plan_lookahead_dist:    50.0
        global_plan_velocity_set:          3.0
        current_velocity_for_debug:        0.0
        exact_arc_length:                  true
        force_reinit_new_goal_dist:        10.0
        force_reinit_new_goal_angular:     1.5707963
        free_goal_vel:                     false

      # ── Obstacles ──────────────────────────────────────────────────────
      Obstacles:
        min_obstacle_dist:                          4.0
        inflation_dist:                             3.5
        dynamic_obstacle_inflation_dist:            4.0
        include_dynamic_obstacles:                  false
        obstacle_poses_affected:                    25
        obstacle_association_force_inclusion_factor: 1.5

      # ── Optimization ───────────────────────────────────────────────────
      Optimization:
        no_inner_iterations:                   15
        no_outer_iterations:                   4
        optimization_activate:                 true
        optimization_verbose:                  true
        penalty_epsilon:                       0.05
        weight_vel_x_limit:                    1.0
        weight_vel_theta_limit:                1.0
        weight_acc_x_limit:                    10.0
        weight_acc_theta_limit:                10.0
        weight_acc_theta_minimize:             10.0
        weight_jerk_minimize:                  10.0
        weight_kinematics_nh:                  100.0
        weight_kinematics_turning_radius_limit: 1.0
        weight_time_minimize:                  0.001
        weight_time_ascend_limit:              100.0
        weight_shortest_path:                  1.0
        weight_obstacle_free_limit:            2.0
        weight_obstacle_of_dynamic_inflation:  0.01
        weight_viapoint:                       0.001
        weight_via_area_base:                  10.0
        weight_via_area_middle:                1.0
        weight_via_area_front:                 1.0
        weight_start_points_velocity:          0.0
        weight_start_points_direction:         0.0
        weight_start_points_interval_distance: 0.0
        weight_final_goal_distance:            0.1
        weight_final_goal_yaw:                 0.1
        weight_final_goal_time:                1.1
        weight_adapt_factor:                   1.2
        divergence_detection_enable:           true
        divergence_detection_max_chi_squared:  10